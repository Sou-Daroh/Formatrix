[package]
name = "formatrix"
version = "1.0.1"
description = "Native desktop application for file conversion and processing"
authors = ["Sou Daroh"]
edition = "2021"

[lib]
name = "formatrix_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
image = "0.25"
csv = "1.3"
pdf-extract = "0.7"
lopdf = "0.34"
zip = "2"
tauri-plugin-clipboard-next = "0.2.4"
thiserror = "2.0.18"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
